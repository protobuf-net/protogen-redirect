<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>protogen has moved to protobuf-net.dev</title>
    <link rel="canonical" href="https://protobuf-net.dev/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://protobuf-net.dev/#schema" />
    <style>
      body {
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 40rem;
        margin: 20vh auto 0;
        padding: 0 1.5rem;
        color: #1c2024;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16181d; color: #e3e6ea; }
        a { color: #63a7ef; }
      }
    </style>
    <script>
      // replace() rather than assign(), so Back does not bounce the visitor straight back here
      location.replace('https://protobuf-net.dev/#schema' + location.search);
    </script>
  </head>
  <body>
    <h1>protogen has moved</h1>
    <p>
      This tool now lives at <a href="https://protobuf-net.dev/#schema">protobuf-net.dev</a>.
      You should be redirected automatically.
    </p>
  </body>
</html>
